<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeScanner - Análisis de Seguridad</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #E3F2FD;
      min-height: 100vh;
      padding: 40px 20px;
      color: #1A237E;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: #FFFFFF;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(25, 118, 210, 0.15);
      padding: 48px;
    }

    h1 {
      color: #0D47A1;
      margin-bottom: 12px;
      font-size: 2.25em;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #546E7A;
      margin-bottom: 40px;
      font-size: 1.05em;
      font-weight: 400;
    }

    .input-section {
      margin-bottom: 48px;
    }

    textarea {
      width: 100%;
      min-height: 200px;
      padding: 16px;
      border: 1px solid #BBDEFB;
      border-radius: 12px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      resize: vertical;
      background: #FFFFFF;
      box-shadow: 0 2px 8px rgba(25, 118, 210, 0.08);
      color: #263238;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea:focus {
      outline: none;
      border-color: #2196F3;
      box-shadow: 0 2px 12px rgba(25, 118, 210, 0.12);
    }

    textarea::placeholder {
      color: #90CAF9;
    }

    input[type="file"] {
      margin-top: 16px;
      margin-bottom: 16px;
      font-size: 14px;
      color: #546E7A;
    }

    button {
      background: #1976D2;
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 16px;
      transition: background-color 0.2s, box-shadow 0.2s;
      box-shadow: 0 2px 8px rgba(25, 118, 210, 0.2);
    }

    button:hover {
      background: #1565C0;
      box-shadow: 0 4px 12px rgba(25, 118, 210, 0.3);
    }

    button:active {
      background: #0D47A1;
      box-shadow: 0 2px 6px rgba(25, 118, 210, 0.25);
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 48px;
    }

    .metric-card {
      background: #64B5F6;
      color: white;
      padding: 28px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(25, 118, 210, 0.15);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .metric-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(25, 118, 210, 0.2);
    }

    .metric-card.high {
      background: #42A5F5;
    }

    .metric-card.medium {
      background: #90CAF9;
      color: #0D47A1;
    }

    .metric-card.low {
      background: #BBDEFB;
      color: #0D47A1;
    }

    .metric-value {
      font-size: 2.5em;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -1px;
    }

    .metric-label {
      font-size: 0.9em;
      opacity: 0.95;
      font-weight: 400;
    }

    .section {
      margin-bottom: 48px;
    }

    .section-title {
      font-size: 1.5em;
      color: #0D47A1;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 2px solid #E3F2FD;
      font-weight: 600;
    }

    .findings-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 48px;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(25, 118, 210, 0.08);
    }

    .findings-table th {
      background: #E3F2FD;
      padding: 16px;
      text-align: left;
      font-weight: 600;
      color: #0D47A1;
      border-bottom: 2px solid #BBDEFB;
      font-size: 0.9em;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .findings-table td {
      padding: 16px;
      border-bottom: 1px solid #E3F2FD;
      color: #37474F;
    }

    .findings-table tr:hover {
      background: #F5F9FF;
    }

    .findings-table tr:last-child td {
      border-bottom: none;
    }

    .severity-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.8em;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .severity-high {
      background: #E3F2FD;
      color: #1565C0;
      border: 1px solid #90CAF9;
    }

    .severity-medium {
      background: #E1F5FE;
      color: #0277BD;
      border: 1px solid #B3E5FC;
    }

    .severity-low {
      background: #E0F2F1;
      color: #00695C;
      border: 1px solid #B2DFDB;
    }

    .ai-summary {
      background: #E3F2FD;
      border-left: 4px solid #1976D2;
      padding: 28px;
      border-radius: 12px;
      margin-bottom: 32px;
      box-shadow: 0 2px 8px rgba(25, 118, 210, 0.1);
    }

    .risk-level {
      display: inline-block;
      padding: 8px 20px;
      border-radius: 10px;
      font-weight: 600;
      margin-bottom: 20px;
      font-size: 0.9em;
      letter-spacing: 0.3px;
    }

    .risk-critical {
      background: #E3F2FD;
      color: #0D47A1;
      border: 1px solid #90CAF9;
    }

    .risk-high {
      background: #E1F5FE;
      color: #01579B;
      border: 1px solid #B3E5FC;
    }

    .risk-medium {
      background: #E0F7FA;
      color: #006064;
      border: 1px solid #B2EBF2;
    }

    .risk-low {
      background: #E8F5E9;
      color: #1B5E20;
      border: 1px solid #C8E6C9;
    }

    .vulnerability-type {
      background: #FAFAFA;
      border: 1px solid #E3F2FD;
      border-radius: 12px;
      padding: 28px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(25, 118, 210, 0.08);
      transition: box-shadow 0.2s;
    }

    .vulnerability-type:hover {
      box-shadow: 0 4px 12px rgba(25, 118, 210, 0.12);
    }

    .vulnerability-type h4 {
      color: #0D47A1;
      margin-bottom: 16px;
      font-size: 1.25em;
      font-weight: 600;
    }

    .vulnerability-meta {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .vulnerability-meta span {
      padding: 6px 14px;
      background: #E3F2FD;
      border-radius: 8px;
      font-size: 0.85em;
      color: #1565C0;
      font-weight: 500;
    }

    .vulnerability-content {
      margin-top: 20px;
    }

    .vulnerability-content p {
      margin-bottom: 12px;
      line-height: 1.7;
      color: #546E7A;
    }

    .vulnerability-content strong {
      color: #0D47A1;
      font-weight: 600;
    }

    .loading {
      text-align: center;
      padding: 48px;
      color: #546E7A;
      font-size: 1.05em;
    }

    .hidden {
      display: none;
    }

    code {
      background: #E3F2FD;
      padding: 3px 8px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 0.9em;
      color: #1565C0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>CodeScanner</h1>
    <p class="subtitle">Análisis inteligente de vulnerabilidades de seguridad</p>

    <div class="input-section">
      <textarea id="codeInput" placeholder="Pega aquí el código a analizar o sube un archivo..."></textarea>
      <input type="file" id="fileInput" accept=".js,.html,.txt,.log">
      <br>
      <button id="btnScan">Analizar código</button>
    </div>

    <div id="results" class="hidden">
      <!-- Métricas -->
      <div class="section">
        <h2 class="section-title">Métricas</h2>
        <div class="metrics" id="metrics"></div>
      </div>

      <!-- Tabla de Findings -->
      <div class="section">
        <h2 class="section-title">Vulnerabilidades detectadas</h2>
        <table class="findings-table" id="findingsTable">
          <thead>
            <tr>
              <th>Línea</th>
              <th>Archivo</th>
              <th>Severidad</th>
              <th>Tipo</th>
              <th>Descripción</th>
              <th>Recomendación</th>
            </tr>
          </thead>
          <tbody id="findingsBody"></tbody>
        </table>
      </div>

      <!-- Resumen Inteligente -->
      <div class="section">
        <h2 class="section-title">Análisis Inteligente</h2>
        <div id="aiSummary"></div>
        <div id="vulnerabilityTypes"></div>
      </div>
    </div>

    <div id="loading" class="loading hidden">
      <p>Analizando código...</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
